version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # to make supply chain attacks harder
    open-pull-requests-limit: 2
    groups:
      prisma:
        applies-to: version-updates
        patterns:
          - 'prisma'
          - '@prisma/*'
      next:
        applies-to: version-updates
        patterns:
          - '@next/*'
          - 'next'
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-query:
        applies-to: version-updates
        patterns:
          - '@tanstack/react-query'
          - '@tanstack/react-query-devtools'
      storybook:
        applies-to: version-updates
        patterns:
          - '@storybook/*'
          - 'storybook'
          - 'storybook-addon-vite-mock'
      tailwindcss:
        applies-to: version-updates
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      trpc:
        applies-to: version-updates
        patterns:
          - '@trpc/*'
      turbo:
        applies-to: version-updates
        patterns:
          - 'turbo'
          - '@turbo/*'
      # oxfmt ships alongside oxlint; group them so the toolchain moves together.
      oxc:
        applies-to: version-updates
        patterns:
          - 'oxlint'
          - 'oxlint-tsgolint'
          - 'oxfmt'
      vitest:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
      playwright:
        applies-to: version-updates
        patterns:
          - 'playwright'
          - '@playwright/*'
      t3-env:
        applies-to: version-updates
        patterns:
          - '@t3-oss/*'
      # Residual OUI footprint: globals.css still imports @opengovsg/oui-theme
      # for the gated restricted-footer. Grouped so a bump lands as one PR.
      oui:
        applies-to: version-updates
        patterns:
          - '@opengovsg/oui*'
      # Adopted from upstream in the 2026-07 merge (logging + test harness).
      starter-kitty:
        applies-to: version-updates
        patterns:
          - '@opengovsg/starter-kitty-*'
      # This fork's own additions, absent from upstream.
      sentry:
        applies-to: version-updates
        patterns:
          - '@sentry/*'
